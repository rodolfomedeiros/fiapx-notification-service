name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # cmd/ é só a fiação do processo; a decisão mora em internal/, que é o que o piso
      # protege. A suíte entrega 97% hoje, então 80% é folga e não meta.
      - run: go test -coverprofile=coverage.out ./internal/...
      - name: Verificar cobertura mínima
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { print substr($3, 1, length($3) - 1) }')
          echo "cobertura de internal/: ${total}%"
          awk -v total="$total" 'BEGIN { if (total < 80) { print "abaixo do mínimo de 80%"; exit 1 } }'
      - run: go test ./...
      - run: docker build .
